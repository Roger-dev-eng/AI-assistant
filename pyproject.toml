[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-desktop"
version = "0.3.8"
description = "Assistente híbrido para Windows em português e inglês"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35", "jsonschema>=4.23", "python-dotenv>=1.0"]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.9", "pycaw>=20251023", "comtypes>=1.4", "psutil>=6"]
browser = ["playwright>=1.48"]
desktop = ["PySide6>=6.8"]
voice = ["faster-whisper>=1.2", "piper-tts>=1.3", "sounddevice>=0.5", "numpy>=1.26"]
sonic = ["aws-sdk-bedrock-runtime[awscrt]>=0.12,<0.13"]
dev = ["pytest>=8.3", "ruff>=0.9", "pyinstaller>=6.11"]

[project.scripts]
assistant = "assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assistant = ["ai/prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
