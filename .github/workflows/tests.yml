name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure diagnostic log directory
        shell: pwsh
        run: |
          "ASSISTANT_LOG_DIR=$(Join-Path $env:RUNNER_TEMP 'assistant-diagnostics')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - run: |
          python -m pip install -r requirements-windows.lock
          python -m pip install --no-deps -e .
      - run: python -m playwright install chromium
      - run: python -m ruff check src tests
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Collect native Windows crash events
        if: always()
        shell: pwsh
        run: ./scripts/collect_crash_events.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-test-results
          path: |
            test-results.xml
            ${{ runner.temp }}/assistant-diagnostics/
