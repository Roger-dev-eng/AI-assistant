name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  installer:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Install locked build dependencies
        run: |
          python -m pip install -r requirements-windows.lock
          python -m pip install --no-deps -e .
      - name: Validate version and release tag
        shell: pwsh
        run: |
          $version = python -c "from importlib.metadata import version; print(version('assistant-desktop'))"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The release tag must match pyproject.toml.'
          }
          if (!(Select-String -LiteralPath packaging/windows.iss -SimpleMatch "#define AppVersion `"$version`"")) {
            throw 'The installer version must match pyproject.toml.'
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python -m playwright install chromium
      - run: python scripts/build_windows.py
      - name: Smoke check frozen application without AWS or microphone
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'diagnostics.json'
          $process = Start-Process -FilePath "$pwd/dist/AssistantDesktop/AssistantDesktop.exe" -ArgumentList @('--diagnostics', $report) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(120000)) { throw 'Frozen diagnostics timed out.' }
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'Frozen diagnostics failed.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (!$result.frozen -or $result.cloud_calls -ne 0) { throw 'Invalid diagnostics report.' }
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is required on the runner.' }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package source and SHA256 checksums
        shell: pwsh
        run: |
          git archive --format=zip --output="dist/installer/AssistantDesktop-$env:APP_VERSION-source.zip" HEAD
          Get-ChildItem -LiteralPath dist/installer -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
          } | Set-Content -LiteralPath dist/installer/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AssistantDesktop-Windows-${{ env.APP_VERSION }}
          path: dist/installer/*
          if-no-files-found: error
      - name: Publish official release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseAssets = @(Get-ChildItem -LiteralPath dist/installer -File | ForEach-Object { $_.FullName })
          gh release create "$env:GITHUB_REF_NAME" @releaseAssets --verify-tag --title "Assistente de IA $env:APP_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
