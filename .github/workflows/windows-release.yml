name: Build Windows installer
on: workflow_dispatch
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,windows,desktop,browser,voice,sonic]"
      - run: python -m playwright install chromium
      - run: python -m pytest -q
      - run: python scripts/build_windows.py
      - shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is required on the runner.' }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AssistantDesktop-Windows
          path: dist/installer/*.exe
